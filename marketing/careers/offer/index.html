<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#082A37">
<title>عرض وظيفي — نُبل وابتكار للخدمات التسويقية</title>
<link rel="icon" href="/marketing/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/marketing/portal/portal.css?v=1">
<style>
  .hd h1{margin:14px 0 2px;font-size:clamp(20px,4.5vw,28px)}
  .hd p{margin:0;opacity:.85;font-size:14px}
  .box{margin-top:-48px;position:relative;z-index:2}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn.ok{background:var(--teal)}.btn.ok:hover{background:var(--ok)}
  .btn.line{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .done{padding:14px;border-radius:12px;background:#EAF7F2;color:#145C45;font-weight:600;margin-top:14px}
  .warn{padding:14px;border-radius:12px;background:#FBF6EC;margin-top:14px;font-size:14px}
  .pad{display:block;width:100%;height:150px;border:1.5px dashed #9BB8C2;border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-top:10px;line-height:1.6}.chk input{margin-top:4px;width:18px;height:18px;flex:none}
  .wa{position:fixed;bottom:18px;inset-inline-end:18px;background:#25D366;color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px #25d36655;z-index:20}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="lcard"><img src="/marketing/logo.png" alt=""><p>جارٍ تحميل العرض…</p></div></div></div>
<a class="wa" id="wa" href="https://wa.me/966563413040" target="_blank" rel="noopener" hidden>تواصل معنا</a>
<script>
'use strict';
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEY = new URLSearchParams(location.search).get('k') || '';
  const API = '/marketing/hub/api/public/offer/' + encodeURIComponent(KEY);
  let D = null;
  function toast(m, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
  function modal(title, body, foot = '') {
    const m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="x" aria-label="إغلاق">×</button><h3>${esc(title)}</h3>${body}${foot ? `<div class="row" style="margin-top:14px">${foot}</div>` : ''}</div>`;
    const close = () => m.remove(); m.onclick = (e) => { if (e.target === m) close(); }; $('.x', m).onclick = close;
    document.body.appendChild(m); return { el: m, close };
  }
  async function call(opts) {
    const r = await fetch(API, opts ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(opts) } : { cache: 'no-store' });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'تعذّر تحميل العرض'); return d;
  }
  function signPad(canvas) {
    const ctx = canvas.getContext('2d'); let drawing = false, has = false;
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B2B3A';
    const pos = (e) => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * canvas.width / r.width, (p.clientY - r.top) * canvas.height / r.height]; };
    const down = (e) => { drawing = true; has = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y); ctx.stroke(); e.preventDefault(); };
    const move = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); };
    const up = () => { drawing = false; };
    canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    canvas.addEventListener('touchstart', down, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', up);
    return { clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); has = false; }, data() { return has ? canvas.toDataURL('image/png') : ''; } };
  }
  function draw() {
    const d = D;
    $('#app').innerHTML = `<header class="hd"><div class="wrap">
        <div class="top"><a class="brand" href="/marketing/" target="_blank" rel="noopener"><img src="/marketing/brand/logo-h-onnavy.svg" alt="نُبل وابتكار للخدمات التسويقية" height="34"></a></div>
        <h1>عرض وظيفي — ${esc(d.name)}</h1><p>${esc(d.job)} · <span class="num">${esc(d.number)}</span></p></div></header>
      <main class="wrap"><div class="c box">
        ${d.status === 'مقبول' ? '<div class="done">🎉 شكراً لك — تم قبول العرض وسنتواصل معك لاستكمال إجراءات التعاقد.</div>' : d.status === 'مرفوض' ? '<div class="warn">تم تسجيل اعتذارك عن العرض. نتمنى لك التوفيق.</div>' : d.expired ? '<div class="warn">انتهت مدة صلاحية هذا العرض — تواصل معنا على واتساب لتجديده.</div>' : ''}
        <div class="docv">${d.html}</div>
        ${d.can_act ? `<div class="acts"><button class="btn ok" id="acc">✍️ أقبل العرض</button><button class="btn line" id="ask">💬 لديّ استفسار</button><button class="btn line" id="dec">أعتذر عن العرض</button></div>` : ''}
      </div></main><footer class="foot">نُبل وابتكار للخدمات التسويقية — جدة · هذا الرابط خاص بك.</footer>`;
    const wa = $('#wa'); wa.hidden = false; wa.href = `https://wa.me/${d.wa}?text=${encodeURIComponent(`السلام عليكم، بخصوص العرض الوظيفي ${d.number}`)}`;
    const acc = $('#acc'); if (acc) acc.onclick = accept;
    const ask = $('#ask'); if (ask) ask.onclick = () => respond('note');
    const dec = $('#dec'); if (dec) dec.onclick = () => respond('decline');
  }
  function accept() {
    const m = modal('قبول العرض الوظيفي', `<p class="small">بقبولك هذا العرض تؤكد موافقتك على المهام والراتب وتاريخ المباشرة وفترة التجربة الواردة فيه، وسنتواصل معك لتوقيع عقد العمل.</p>
      <input class="inp" id="sn" placeholder="اسمك الكامل كما في الهوية" maxlength="80" value="${esc(D.name)}" style="width:100%;margin-bottom:10px">
      <div class="small" style="margin-bottom:6px">توقيعك (اختياري):</div><canvas class="pad" id="pad" width="700" height="220"></canvas><div class="row" style="margin-top:6px"><button class="btn line" id="clr" type="button">مسح</button></div>
      <textarea class="inp" id="nt" rows="2" placeholder="ملاحظة (اختياري)" style="width:100%;margin-top:10px"></textarea>
      <label class="chk"><input type="checkbox" id="agree"> أقرّ بأنني اطلعت على العرض كاملاً وأقبله.</label>`, '<button class="btn ok" id="go">تأكيد القبول</button>');
    const pad = signPad($('#pad', m.el)); $('#clr', m.el).onclick = () => pad.clear();
    $('#go', m.el).onclick = async (e) => {
      const name = $('#sn', m.el).value.trim(); if (name.length < 3) return toast('اكتب اسمك الكامل', 1); if (!$('#agree', m.el).checked) return toast('أكّد الإقرار أولاً', 1);
      e.target.disabled = true;
      try { D = await call({ action: 'accept', name, agree: true, sig: pad.data(), note: $('#nt', m.el).value.trim() }); m.close(); toast('مبارك — تم قبول العرض'); draw(); }
      catch (err) { toast(err.message, 1); e.target.disabled = false; }
    };
  }
  function respond(action) {
    const dec = action === 'decline';
    const m = modal(dec ? 'الاعتذار عن العرض' : 'استفسار على العرض', `<p class="small">${dec ? 'نأسف لذلك — إن رغبت أخبرنا بالسبب ليفيدنا مستقبلاً.' : 'اكتب استفسارك أو ما تودّ مناقشته، وسيتواصل معك فريق التوظيف.'}</p><textarea class="inp" rows="3" id="nt" placeholder="${dec ? 'السبب (اختياري)' : 'استفسارك'}" style="width:100%"></textarea>`,
      `<button class="btn ${dec ? '' : 'ok'}" id="go">${dec ? 'تأكيد الاعتذار' : 'إرسال الاستفسار'}</button>`);
    $('#go', m.el).onclick = async (e) => {
      const note = $('#nt', m.el).value.trim(); if (!dec && !note) return toast('اكتب استفسارك أولاً', 1);
      e.target.disabled = true;
      try { D = await call({ action: dec ? 'decline' : 'note', note }); m.close(); toast(dec ? 'تم تسجيل اعتذارك' : 'وصلنا استفسارك'); draw(); }
      catch (err) { toast(err.message, 1); e.target.disabled = false; }
    };
  }
  (async () => {
    try { D = await call(); draw(); }
    catch (e) { $('#app').innerHTML = `<div class="login"><div class="lcard"><img src="/marketing/logo.png" alt=""><p>${esc(e.message)}</p><a class="btn" href="https://wa.me/966563413040" target="_blank" rel="noopener">تواصل معنا على واتساب</a></div></div>`; }
  })();
})();
</script>
</body>
</html>
