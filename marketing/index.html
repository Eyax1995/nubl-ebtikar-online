<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نُبل وابتكار للتسويق — Nubl &amp; Ebtikar Marketing</title>
<meta name="description" content="قسم التسويق الكامل للمنشآت الصغيرة في جدة — محتوى، إعلانات، تصوير، ومطبوعات من منظومة واحدة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#15556B; --navy-d:#0C3B4C; --navy-x:#082A37;
  --gold:#DC9C47; --terra:#D2652A; --teal:#308D8B;
  --paper:#FCFAF6; --cream:#F4EDE1; --line:#E3D9C9;
  --ink:#12333F; --muted:#5D7581;
  --r:14px;
  --fs:clamp(15px,0.55vw + 13.2px,17px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  font-size:var(--fs); line-height:1.75; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="en"] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,92vw);margin-inline:auto}
section{padding:clamp(64px,7vw,118px) 0;position:relative}

/* ---------- type ---------- */
h1,h2,h3,h4{line-height:1.24;font-weight:600;letter-spacing:-.015em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0;line-height:1.4}
h2{font-size:clamp(28px,3.1vw,45px);color:var(--navy-x)}
h3{font-size:clamp(18px,1.35vw,21px)}
.tag{
  display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:20px;
}
html[lang="ar"] .tag{letter-spacing:.03em;font-size:13.5px}
.tag::before{content:"";width:22px;height:1.5px;background:var(--gold)}
.lead{font-size:clamp(16.5px,1.25vw,19.5px);color:var(--muted);max-width:62ch}
.mut{color:var(--muted)}
.note{font-size:12.5px;color:#8A9AA3;line-height:1.65}

/* ---------- star motif ---------- */
.star{display:inline-block;width:1em;height:1em;flex:none;
  background:currentColor;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%);}

/* ---------- nav ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(252,250,246,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.on{border-color:var(--line);box-shadow:0 1px 24px rgba(12,59,76,.05)}
.nav{display:flex;align-items:center;gap:26px;height:70px}
.brandmark{display:flex;align-items:center;gap:11px;flex:none}
.brandmark img{height:38px;width:auto}
.navlinks{display:flex;gap:22px;margin-inline-start:auto;font-size:14.5px;font-weight:500;color:var(--muted)}
.navlinks a{position:relative;padding:4px 0;transition:color .2s}
.navlinks a::after{content:"";position:absolute;bottom:0;inset-inline:0;height:1.5px;background:var(--terra);
  transform:scaleX(0);transition:transform .25s;transform-origin:inline-start}
.navlinks a:hover{color:var(--navy)}
.navlinks a:hover::after{transform:scaleX(1)}
.navact{display:flex;gap:10px;align-items:center;margin-inline-start:auto}
.navlinks + .navact{margin-inline-start:0}
#lang{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:600;
  width:42px;height:36px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px;transition:.2s}
#lang:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 26px;border-radius:10px;font-weight:600;font-size:15px;
  border:1.5px solid transparent;cursor:pointer;transition:.22s;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--terra);color:#fff;box-shadow:0 6px 20px rgba(210,101,42,.24)}
.btn-p:hover{background:#BE5423;transform:translateY(-2px);box-shadow:0 10px 26px rgba(210,101,42,.3)}
.btn-g{border-color:var(--navy);color:var(--navy)}
.btn-g:hover{background:var(--navy);color:#fff}
.btn-w{background:#fff;color:var(--navy)}
.btn-w:hover{background:var(--gold);color:#fff}

/* ---------- hero ---------- */
.hero{padding-top:clamp(48px,5vw,76px);padding-bottom:0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(30px,4vw,64px);align-items:center}
.hero h1{font-size:clamp(32px,4.1vw,58px);color:var(--navy-x);font-weight:600;margin:16px 0 24px}
html[lang="ar"] .hero h1{font-weight:700}
.hero .lead{margin-bottom:30px}
.promise{display:inline-flex;align-items:center;gap:11px;background:var(--cream);
  border:1px solid var(--line);border-radius:999px;padding:9px 20px;font-weight:600;
  color:var(--navy);font-size:15px;margin-bottom:30px}
.promise .star{color:var(--gold);font-size:14px}
.hero-cta{display:flex;gap:13px;flex-wrap:wrap}
.logo-stage{position:relative;display:grid;place-items:center;padding:20px}
.logo-stage img{width:min(100%,400px);filter:drop-shadow(0 18px 44px rgba(12,59,76,.14))}
.logo-stage::before{content:"";position:absolute;inset:-6%;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(220,156,71,.17),rgba(48,141,139,.07) 45%,transparent 70%);z-index:-1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:clamp(46px,5vw,72px)}
.stat{background:var(--paper);padding:26px 22px}
.stat b{display:block;font-size:clamp(27px,2.7vw,38px);color:var(--navy);font-weight:600;line-height:1.1;
  font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.stat b span{font-size:.46em;color:var(--terra);font-weight:600;margin-inline-start:5px}
.stat p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.statsnote{margin-top:14px}

/* ---------- opportunity ---------- */
.sec-cream{background:var(--cream)}
.opp-top{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,4vw,64px);align-items:start;margin-bottom:52px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;transition:.25s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(12,59,76,.07);border-color:#D3C6B0}
.card .star{color:var(--gold);font-size:15px;margin-bottom:14px}
.card h3{margin-bottom:9px;color:var(--navy-d);font-size:17.5px}
.card p{font-size:14.5px;color:var(--muted);line-height:1.7}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(30px,5vw,72px);align-items:start}
.about-grid p{margin-bottom:18px;color:#3E5A66}
.facts{background:var(--navy-x);border-radius:var(--r);padding:8px 30px;color:#fff}
.fact{display:flex;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.11);font-size:15px}
.fact:last-child{border:none}
.fact span:first-child{color:#9DBDC9}
.fact span:last-child{font-weight:600;font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.quote{margin-top:26px;padding:26px 28px;background:var(--cream);border-radius:var(--r);
  border-inline-start:3px solid var(--terra);font-size:clamp(17px,1.5vw,21px);
  font-weight:500;color:var(--navy-x);line-height:1.6}
.disc{margin-top:18px;padding:16px 20px;border:1px dashed var(--line);border-radius:11px}

/* ---------- why ---------- */
.why-list{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:44px}
.why-item{background:var(--paper);padding:34px 32px;transition:background .25s}
.why-item:hover{background:#fff}
.why-item b{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.1em;color:var(--gold);margin-bottom:14px}
.why-item h3{color:var(--navy-x);margin-bottom:11px}
.why-item p{color:var(--muted);font-size:15px}

/* ---------- services ---------- */
.svc-head{display:flex;align-items:baseline;gap:14px;margin:44px 0 22px}
.svc-head h3{color:var(--navy-x);font-size:clamp(19px,1.7vw,25px)}
.svc-head i{flex:1;height:1px;background:var(--line);font-style:normal}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;transition:.25s;position:relative;overflow:hidden}
.svc::after{content:"";position:absolute;inset-block-start:0;inset-inline-start:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--terra));transform:scaleX(0);transform-origin:inline-start;transition:transform .3s}
.svc:hover::after{transform:scaleX(1)}
.svc:hover{border-color:#D3C6B0;box-shadow:0 12px 30px rgba(12,59,76,.07)}
.svc h4{font-size:16.5px;color:var(--navy-d);margin-bottom:8px;font-weight:600}
.svc p{font-size:14px;color:var(--muted);line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 17px;
  font-size:14px;color:var(--navy-d);transition:.2s}
.chip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- packages ---------- */
.sec-navy{background:var(--navy-x);color:#fff}
.sec-navy h2{color:#fff}
.sec-navy .lead,.sec-navy .mut{color:#A9C6D2}
.sec-navy .tag{color:var(--gold)}
.sec-navy .tag::before{background:var(--gold)}
.ptable{margin-top:44px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptable table{width:100%;min-width:820px;border-collapse:collapse;font-size:14.5px}
.ptable th,.ptable td{padding:15px 18px;text-align:start;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:top}
.ptable thead th{border-bottom:1px solid rgba(255,255,255,.22);vertical-align:bottom;padding-bottom:22px}
.ptable tbody th{color:#9DBDC9;font-weight:400;width:180px}
.ptable td{color:#E4EFF3}
.pname{font-size:20px;font-weight:600;display:block;margin-bottom:4px}
.ptag{font-size:12.5px;color:var(--gold);display:block;margin-bottom:14px}
.pprice{font-size:clamp(26px,2.4vw,34px);font-weight:600;font-family:"IBM Plex Sans",sans-serif;
  direction:ltr;unicode-bidi:isolate;display:block;line-height:1.1}
.pprice small{font-size:13px;color:#9DBDC9;font-weight:400;margin-inline-start:6px}
.col-pop{background:rgba(220,156,71,.12);position:relative}
.badge{display:inline-block;background:var(--gold);color:#2A1806;font-size:11.5px;font-weight:700;
  padding:3px 11px;border-radius:999px;margin-bottom:9px;letter-spacing:.04em}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.12);border-radius:var(--r);overflow:hidden;margin-top:26px}
.extra{background:var(--navy-x);padding:20px 22px;display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.extra span:first-child{font-size:14.5px}
.extra span:last-child{color:var(--gold);font-weight:600;font-family:"IBM Plex Sans",sans-serif;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-size:14.5px}
.offer{margin-top:34px;background:linear-gradient(135deg,var(--terra),#B84A1E);border-radius:var(--r);
  padding:clamp(26px,3vw,42px);display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,44px);align-items:center}
.offer .badge{background:rgba(255,255,255,.92);color:#8C3A16}
.offer h3{font-size:clamp(21px,2vw,28px);margin-bottom:10px}
.offer p{color:rgba(255,255,255,.9);font-size:15.5px;max-width:70ch}

/* ---------- method ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:44px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;position:relative}
.step-n{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-weight:600;font-family:"IBM Plex Sans",sans-serif;font-size:15px;margin-bottom:16px}
.step h4{font-size:16.5px;color:var(--navy-x);margin-bottom:8px}
.step p{font-size:14px;color:var(--muted);line-height:1.65}
.step em{display:inline-block;margin-top:13px;font-style:normal;font-size:12.5px;font-weight:600;
  color:var(--terra);background:#FCF1E8;padding:4px 12px;border-radius:999px}
.commit{margin-top:34px;background:var(--cream);border-radius:var(--r);padding:clamp(26px,3vw,38px)}
.commit h3{color:var(--navy-x);margin-bottom:20px}
.commit ul{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 30px}
.commit li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:#3E5A66}
.commit li .star{color:var(--teal);font-size:13px;margin-top:.42em}

/* ---------- sectors ---------- */
.sect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.sect{border:1px solid var(--line);border-radius:var(--r);padding:28px 26px;background:var(--paper);transition:.25s}
.sect.pri{background:var(--navy-x);border-color:var(--navy-x);color:#fff}
.sect.pri h3{color:#fff}.sect.pri p{color:#A9C6D2}
.sect.pri .star{color:var(--gold)}
.sect:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(12,59,76,.08)}
.sect .star{color:var(--teal);font-size:15px;margin-bottom:14px}
.sect h3{color:var(--navy-x);margin-bottom:9px;font-size:17.5px}
.sect p{font-size:14.5px;color:var(--muted);line-height:1.7}

/* ---------- contact ---------- */
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,72px);align-items:center}
.ct-list{display:grid;gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r);overflow:hidden}
.ct-item{background:var(--navy-x);padding:20px 24px;display:flex;justify-content:space-between;
  align-items:center;gap:16px;transition:background .2s}
.ct-item:hover{background:#0B3away}
.ct-item:hover{background:#0A3241}
.ct-item span{color:#9DBDC9;font-size:14.5px}
.ct-item b{font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate;font-size:17px;font-weight:600}
.ct-meta{margin-top:24px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;color:#A9C6D2}
.ct-meta a{color:var(--gold);font-weight:600}
.ct-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

/* ---------- footer ---------- */
footer{background:#061F29;color:#7E9CA8;padding:44px 0;font-size:13.5px}
.f-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.f-grid b{color:#fff;font-size:16px;display:block;margin-bottom:5px}
.f-legal{font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}

/* ---------- pattern strip ---------- */
.strip{height:7px;background:
  repeating-linear-gradient(90deg,var(--navy) 0 16px,transparent 16px 24px,var(--terra) 24px 40px,transparent 40px 48px,var(--gold) 48px 64px,transparent 64px 72px,var(--teal) 72px 88px,transparent 88px 96px)}


/* terms + sector prices */
.terms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 34px}
.term{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:20px 20px}
.term.best{border-color:var(--gold);background:rgba(220,156,71,.13)}
.term b{display:block;font-size:19px;color:#fff;font-weight:600}
.term .tm{display:block;font-size:13px;color:var(--gold);margin:3px 0 9px;font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.term p{font-size:13.5px;color:#A9C6D2;line-height:1.55;min-height:38px}
.term em{display:inline-block;font-style:normal;font-size:12.5px;font-weight:600;color:#0E3B2A;
background:#8FD9AE;padding:3px 11px;border-radius:999px;margin-top:10px}
.term.best em{background:var(--gold);color:#2A1806}
.secprice{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.13);
border:1px solid rgba(255,255,255,.13);border-radius:var(--r);overflow:hidden;margin:18px 0 34px}
.sp{background:var(--navy-x);padding:20px 22px}
.secprice .sp:last-child{grid-column:1/-1;background:linear-gradient(90deg,rgba(220,156,71,.10),var(--navy-x))}
.spn{font-size:16px;font-weight:600;color:#fff}
.spp{margin:6px 0 8px}
.spp b{font-size:27px;color:var(--gold);font-weight:600;font-family:"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.spp small{font-size:12.5px;color:#9DBDC9;margin-inline-start:6px}
.sp p{font-size:13px;color:#A9C6D2;line-height:1.6}
@media(max-width:900px){.terms{grid-template-columns:repeat(2,1fr)}.secprice{grid-template-columns:1fr}}
@media(max-width:560px){.terms{grid-template-columns:1fr}}


/* ethos */
.vmgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-top:8px}
.vmcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 28px}
.vmcard.goal{grid-column:1/-1;background:var(--navy-x);border-color:var(--navy-x)}
.vmcard span{display:block;font-size:12.5px;font-weight:700;color:var(--terra);letter-spacing:.04em;margin-bottom:10px}
.vmcard.goal span{color:var(--gold)}
.vmcard p{font-size:16px;color:#3E5A66;line-height:1.75}
.vmcard.goal p{color:#fff;font-size:clamp(18px,1.7vw,24px);font-weight:600;line-height:1.55}
.valgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.valc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px;transition:.24s}
.valc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(12,59,76,.07)}
.valc b{display:flex;align-items:baseline;gap:9px;font-size:17px;color:var(--navy-x);font-weight:600}
.valc b .star{color:var(--teal);font-size:12px}
.valc p{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:9px}
.pilgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pilc{background:var(--navy-x);color:#fff;border-radius:var(--r);padding:26px 26px}
.pilc h4{font-size:20px;color:var(--gold);font-weight:600}
.pilc em{display:block;font-style:normal;font-size:13.5px;color:#9DBDC9;margin:4px 0 16px}
.pilc ul{list-style:none;display:grid;gap:10px}
.pilc li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:9px}
.pilc li:last-child{border:none;padding-bottom:0}
.pilc li span{color:#A9C6D2}
.pilc li b{color:#fff;font-weight:600;text-align:end}
@media(max-width:1000px){.valgrid{grid-template-columns:repeat(2,1fr)}.pilgrid{grid-template-columns:1fr}
.vmgrid{grid-template-columns:1fr}}
@media(max-width:620px){.valgrid{grid-template-columns:1fr}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media(max-width:1000px){
  .hero-grid,.opp-top,.about-grid,.ct-grid{grid-template-columns:1fr}
  .logo-stage{order:-1;padding:0 0 8px}
  .logo-stage img{width:min(72%,300px)}
  .cards4,.svc-grid,.steps{grid-template-columns:repeat(2,1fr)}
  .why-list,.sect-grid,.extras,.commit ul{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .navlinks{display:none}
  .offer{grid-template-columns:1fr}
}
@media(max-width:620px){

  opp:{
    tag:"The opportunity",
    h:"The market is growing — but nearly all of the growth is digital",
    body:"Saudi Arabia's marketing and advertising agency market is growing at a moderate 5–6% a year, while digital ad spend is growing roughly three times faster at 16–19%. Over the same period, registered SMEs rose to 1.68 million — up 48% in a single year — with Makkah Region the second-largest share. The result: thousands of new owners in Jeddah every year who need professional marketing, have no marketing department, and cannot justify a large agency.",

      {t:"No marketing function",d:"The small business relies on the owner or a relative who 'knows social' — no plan, no measurement, no continuity."},
      {t:"Sharp seasonality",d:"In flowers, gifting and events, half the annual revenue is decided across six seasons. Being two weeks late means losing the season entirely."},

  about:{
    tag:"About",
    h:"From a print house to a complete marketing system",
    p1:"Nubl & Ebtikar Marketing is the digital arm of Nubl & Ebtikar for Advertising in Jeddah — an operating entity with a registered trademark, a commercial registration and a VAT number, and a real commercial network built by serving hundreds of businesses across print, signage and visual identity.",
    p2:"The digital arm exists for one reason: our clients bought their banners, brochures and packaging from us, then went elsewhere to run their accounts and campaigns — with uneven results and a conflicting brand. We now close that loop. Strategy, content, paid media, photography, print and gifting from one system, to one quality standard, with one person accountable to you.",

    quote:"We don't sell engagement. We sell qualified leads, bookings and sales — and we prove it in a monthly report.",

  why:{

    items:[
      {n:"01",t:"We own production, we don&rsquo;t buy it",d:"An equipped production department and an advertising and print department inside the same group. Competitors in our tier hire a photographer per shoot and broker their print — cost rises and consistency breaks. We produce at our own cost, so we can sell at a price they cannot match."},
      {n:"02",t:"An entry price of SAR 1,750",d:"Around 45% below agencies in the same tier in Jeddah, and less than half the salary of one marketing hire — with the full scope, not a stripped version, and with photography and print included inside the retainer."},
      {n:"03",t:"Packages built for your sector, not for everyone",d:"Seven sectors, each with its own scope, seasons and metrics. A flower shop does not need what a factory needs, and should not be priced like one. Four contract terms let you match the commitment to your cash: one, three, six or twelve months."},
      {n:"04",t:"Seasons planned in advance",d:"We do not chase the season — we plan it. Each season&rsquo;s plan reaches you six weeks ahead and the print runs four weeks ahead: message, content and budget ready before the countdown starts."}

  ethos:{
    tag:"What we stand for",
    h:"What we say about ourselves — and what you can hold us to",
    visionK:"Vision", vision:"That Nubl becomes the first call a business owner in the Western Region makes when they decide to take their marketing seriously — because we are the only ones who own the idea, the camera and the press together.",
    missionK:"Mission", mission:"We run marketing end to end for small and mid-sized businesses — strategy, content, paid media, production and print — to a single quality standard, on deadlines we commit to contractually, with a monthly report that measures the result in riyals rather than in likes.",
    goalK:"Our purpose", goal:"We turn your idea into something your customer sees and buys because of — on screen and in hand.",
    valuesTitle:"Our seven values — and what each means in practice",
    values:[

      {n:"Commitment",d:"We treat your account the way we treat our own. And our own accounts are a live showcase — if we can't grow ours, we have no case to make to you."},
      {n:"Initiative",d:"We don't wait to be asked. Each season's plan reaches you six weeks ahead, and we flag problems before you find them."},
      {n:"Constructiveness",d:"Bad news gets said — with the fix beside it. Every report names what didn't work and proposes the alternative in the same line."},
      {n:"Curiosity",d:"We ask before we design. Twelve questions in the diagnostic session before any proposal — no execution before we understand your season and your margin."},
      {n:"Quality",d:"What you approve on screen is what arrives printed, because we print it ourselves. Plus mandatory Arabic human review on every output."},
      {n:"Transparency",d:"Price, scope and limits are written before signature. We state what the package excludes as clearly as what it includes."}

  <section class="sec-cream" id="about">
    <div class="wrap">
      <div class="opp-top">
        <div class="rv"><div class="tag">${O.tag}</div><h2>${O.h}</h2></div>
        <p class="lead rv" style="padding-top:8px">${O.body}</p>
      </div>
      <div class="cards4">
        ${O.cards.map(c=>`<div class="card rv"><i class="star"></i><h3>${c.t}</h3><p>${c.d}</p></div>`).join("")}
      </div>
    </div>
  </section>

  <section>
    <div class="wrap about-grid">
      <div class="rv">
        <div class="tag">${A.tag}</div>
        <h2 style="margin-bottom:24px">${A.h}</h2>
        <p>${A.p1}</p><p>${A.p2}</p>
        <div class="quote">${A.quote}</div>
        <div class="disc"><p class="note">${A.disclaimer}</p></div>
      </div>
      <div class="facts rv">
        ${A.facts.map(f=>`<div class="fact"><span>${f.k}</span><span>${f.v}</span></div>`).join("")}
      </div>
    </div>
  </section>


  <section class="sec-cream" id="ethos">
    <div class="wrap">
      <div class="rv"><div class="tag">${E.tag}</div><h2>${E.h}</h2></div>
      <div class="vmgrid rv">
        <div class="vmcard"><span>${E.visionK}</span><p>${E.vision}</p></div>
        <div class="vmcard"><span>${E.missionK}</span><p>${E.mission}</p></div>
        <div class="vmcard goal"><span>${E.goalK}</span><p>${E.goal}</p></div>
      </div>
      <div class="svc-head rv"><h3>${E.valuesTitle}</h3><i></i></div>
      <div class="valgrid">
        ${E.values.map(v=>`<div class="valc rv"><b><i class="star"></i>${v.n}</b><p>${v.d}</p></div>`).join("")}
      </div>
      <div class="svc-head rv"><h3>${E.pillarsTitle}</h3><i></i></div>
      <div class="pilgrid">
        ${E.pillars.map(p=>`<div class="pilc rv"><h4>${p.n}</h4><em>${p.c}</em>
          <ul>${p.p.map(x=>`<li><span>${x[0]}</span><b>${x[1]}</b></li>`).join("")}</ul></div>`).join("")}
      </div>
    </div>
  </section>
  <section id="why">
    <div class="wrap">
      <div class="rv"><div class="tag">${W.tag}</div><h2>${W.h}</h2></div>
      <div class="why-list">
        ${W.items.map(i=>`<div class="why-item rv"><b>${i.n}</b><h3>${i.t}</h3><p>${i.d}</p></div>`).join("")}
      </div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <div class="rv"><div class="tag">${S.tag}</div><h2>${S.h}</h2></div>
      <div class="svc-head rv"><h3>${S.digitalTitle}</h3><i></i></div>
      <div class="svc-grid">
        ${S.digital.map(s=>`<div class="svc rv"><h4>${s.t}</h4><p>${s.d}</p></div>`).join("")}
      </div>
      <div class="svc-head rv"><h3>${S.prodTitle}</h3><i></i></div>
      <p class="lead rv" style="font-size:16px;margin-bottom:4px">${S.prodNote}</p>
      <div class="chips rv">${S.prod.map(p=>`<span class="chip">${p}</span>`).join("")}</div>
      <div class="svc-head rv"><h3>${S.printTitle}</h3><i></i></div>
      <p class="lead rv" style="font-size:16px;margin-bottom:4px">${S.printNote}</p>
      <div class="chips rv">${S.print.map(p=>`<span class="chip">${p}</span>`).join("")}</div>
    </div>
  </section>

  <section class="sec-navy" id="packages">
    <div class="wrap">
      <div class="rv"><div class="tag">${P.tag}</div><h2>${P.h}</h2>
      <p class="lead" style="margin-top:16px">${P.sub}</p></div>

      <div class="svc-head rv" style="margin-bottom:6px"><h3 style="color:#fff;font-size:19px">${P.termsTitle}</h3><i style="background:rgba(255,255,255,.16)"></i></div>
      <div class="terms rv">
        ${P.terms.map((t,i)=>`<div class="term${i===2?" best":""}">
          <b>${t.n}</b><span class="tm">${t.m}</span><p>${t.d}</p><em>${t.x}</em></div>`).join("")}
      </div>

      <div class="svc-head rv" style="margin-bottom:6px"><h3 style="color:#fff;font-size:19px">${P.secTitle}</h3><i style="background:rgba(255,255,255,.16)"></i></div>
      <div class="secprice rv">
        ${P.sectors.map(x=>`<div class="sp"><div class="spn">${x.name}</div>
          <div class="spp"><b>${x.price}</b><small>${d.lang==="ar"?"ر.س / شهر":"SAR / mo"}</small></div>
          <p>${x.d}</p></div>`).join("")}
      </div>

      <div class="svc-head rv" style="margin-bottom:0"><h3 style="color:#fff;font-size:19px">${P.extrasTitle}</h3><i style="background:rgba(255,255,255,.16)"></i></div>
      <div class="extras rv">
        ${P.extras.map(e=>`<div class="extra"><span>${e.t}</span><span>${e.p}</span></div>`).join("")}
      </div>
      <div class="offer rv">
        <div><span class="badge">${P.offerTag}</span><h3>${P.offerH}</h3></div>
        <p>${P.offerB}</p>
      </div>
    </div>
  </section>

  <section id="method">
    <div class="wrap">
      <div class="rv"><div class="tag">${M.tag}</div><h2>${M.h}</h2></div>
      <div class="steps">
        ${M.steps.map(s=>`<div class="step rv"><div class="step-n">${s.n}</div><h4>${s.t}</h4><p>${s.d}</p><em>${s.time}</em></div>`).join("")}
      </div>
      <div class="commit rv">
        <h3>${M.commitTitle}</h3>
        <ul>${M.commit.map(c=>`<li><i class="star"></i><span>${c}</span></li>`).join("")}</ul>
      </div>
    </div>
  </section>

  <section class="sec-cream" id="sectors">
    <div class="wrap">
      <div class="rv"><div class="tag">${C.tag}</div><h2>${C.h}</h2>
      <p class="lead" style="margin-top:16px">${C.sub}</p></div>
      <div class="sect-grid">
        ${C.items.map(s=>`<div class="sect rv ${s.pri?"pri":""}"><i class="star"></i><h3>${s.t}</h3><p>${s.d}</p></div>`).join("")}
      </div>
    </div>
  </section>

  <section class="sec-navy" id="contact">
    <div class="wrap ct-grid">
      <div class="rv">
        <div class="tag">${T.tag}</div>
        <h2>${T.h}</h2>
        <p class="lead" style="margin-top:16px">${T.sub}</p>
        <div class="ct-cta">
          <a class="btn btn-w" href="https://wa.me/966542779407" target="_blank" rel="noopener">${T.wa}</a>
          <a class="btn btn-p" href="https://instagram.com/nublandebtikar" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
      <div class="rv">
        <div class="ct-list">
          ${T.ch.map(c=>`<a class="ct-item" href="${c.href}"><span>${c.l}</span><b>${c.v}</b></a>`).join("")}
        </div>
        <div class="ct-meta">
          <div>${T.addr}</div>
          <div><a href="https://instagram.com/nublandebtikar" target="_blank" rel="noopener">${T.social}</a></div>
        </div>
      </div>
    </div>
  </section>`;

  const F=d.footer;
  document.getElementById("foot").innerHTML=
    `<div><b>${F.name}</b>${F.parent}</div>
     <div class="f-legal">${F.legal}</div>
     <div>© ${new Date().getFullYear()} — ${F.rights}</div>`;

  observe();
}

let io;
function observe(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
  }),{threshold:.08,rootMargin:"0px 0px -40px 0px"});
  document.querySelectorAll(".rv").forEach((el,i)=>{
    el.style.transitionDelay=(Math.min(i%4,3)*70)+"ms";
    io.observe(el);
  });
}

document.getElementById("lang").addEventListener("click",()=>{
  const y=window.scrollY; render(cur==="ar"?"en":"ar");
  requestAnimationFrame(()=>window.scrollTo({top:y}));
});

const hdr=document.getElementById("hdr");
addEventListener("scroll",()=>hdr.classList.toggle("on",scrollY>12),{passive:true});

render("ar");
</script>
