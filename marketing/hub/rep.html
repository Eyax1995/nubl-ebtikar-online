<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#082A37">
<title>كشف حساب المندوب — نُبل وابتكار للتسويق</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#082A37;--navy:#15556B;--teal:#308D8B;--gold:#DC9C47;--terra:#D2652A;--sand:#F4EDE1;--paper:#FCFAF6;--line:#E8E0D2;--muted:#6B7B82}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--paper);color:var(--deep);line-height:1.6}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{background:linear-gradient(135deg,var(--deep),var(--navy));color:#fff;padding:22px 16px 64px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px}.top img{height:38px}
.top span{font-size:13px;opacity:.8}
h1{margin:18px 0 2px;font-size:24px}.sub{opacity:.85;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-44px}
.c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 20px #082a3712}
.c>span{display:block;font-size:12.5px;color:var(--muted)}.c b{font-size:21px;color:var(--navy)}.c small{font-size:12px;color:var(--muted)}
.c.g b{color:var(--teal)}.c.o b{color:var(--terra)}
section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
h2{font-size:16px;margin:0 0 10px;color:var(--navy);display:flex;gap:8px;align-items:center}
h2:before{content:'';width:4px;height:16px;border-radius:2px;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:var(--teal);color:#fff;font-weight:600;padding:8px;text-align:right}
th:first-child{border-radius:0 8px 0 0}th:last-child{border-radius:8px 0 0 0}td{padding:8px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.p-مستحقة{background:#FBF1E1;color:#8A5A12}.p-معتمدة{background:#E5EEF2;color:var(--navy)}.p-مصروفة{background:#E2F2F0;color:#1F6B69}
.muted{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:18px;font-size:14px}
.rules{font-size:13px;color:var(--muted)}.rules li{margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--sand);border-radius:99px;padding:4px 12px;font-size:13px}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding:26px 16px}
.btn{border:0;background:var(--gold);color:var(--deep);font:inherit;font-weight:700;border-radius:10px;padding:8px 16px;cursor:pointer}
.err{max-width:520px;margin:80px auto;text-align:center;padding:0 16px}.err img{height:56px}
@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}.c b{font-size:18px}
  table.r thead{display:none}table.r tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
  table.r td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0}table.r td:before{content:attr(data-l);color:var(--muted);font-size:12.5px}}
@media print{header{background:var(--deep);-webkit-print-color-adjust:exact;print-color-adjust:exact}.btn{display:none}}
</style>
</head>
<body>
<div id="app"><div class="err"><img src="../logo.png" alt=""><p class="muted">جارٍ تحميل كشف الحساب…</p></div></div>
<script>
'use strict';
(async function () {
  const app = document.getElementById('app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
  const m = (v) => `<span><span class="num">${nf.format(Number(v) || 0)}</span> ر.س</span>`;
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const fd = (d) => { if (!d) return '—'; const [y, mo, da] = String(d).slice(0, 10).split('-'); return `<span><span class="num">${+da}</span> ${MONTHS[+mo - 1]} <span class="num">${y}</span></span>`; };
  const fail = (msg) => { app.innerHTML = `<div class="err"><img src="../logo.png" alt=""><h2 style="justify-content:center">${esc(msg)}</h2><p class="muted">تواصل مع فريق نُبل وابتكار للتسويق للحصول على رابط محدّث.</p></div>`; };
  const tok = (location.hash || '').replace(/^#/, '').trim();
  if (!/^nrp_[a-f0-9]{32}$/.test(tok)) return fail('الرابط غير صالح');
  let d;
  try {
    const r = await fetch('api/public/rep?t=' + encodeURIComponent(tok), { cache: 'no-store' });
    d = await r.json(); if (!r.ok) return fail(d.error || 'تعذّر فتح الكشف');
  } catch { return fail('تعذّر الاتصال — حاول مرة أخرى'); }
  const t = d.totals; const rp = d.rep;
  document.title = `كشف حساب ${rp.name} — نُبل وابتكار للتسويق`;
  app.innerHTML = `<header><div class="wrap"><div class="top"><img src="../logo-white.png" alt="نُبل وابتكار"><span>${esc(d.company)}</span></div>
      <h1>أهلاً ${esc(rp.name)}</h1><div class="sub">كشف حساب عمولاتك · محدّث حتى ${fd(d.today)} · نسبتك <b class="num">${rp.rate}%</b> ${rp.base === 'gross' ? 'من المبلغ شامل الضريبة' : 'من المبلغ قبل الضريبة'}</div></div></header>
    <div class="wrap">
      <div class="cards"><div class="c o"><span>مستحقة (بانتظار الاعتماد)</span><b>${m(t.due)}</b></div><div class="c"><span>معتمدة (بانتظار الصرف)</span><b>${m(t.approved)}</b></div>
        <div class="c g"><span>تم صرفها</span><b>${m(t.paid)}</b></div><div class="c"><span>إجمالي عمولاتك</span><b>${m(t.all)}</b></div></div>
      <section><h2>عملاؤك (${d.clients.length})</h2>${d.clients.length ? `<table class="r"><thead><tr><th>العميل</th><th>تستمر عمولتك حتى</th></tr></thead><tbody>
        ${d.clients.map((c) => `<tr><td data-l="العميل"><b>${esc(c.name)}</b></td><td data-l="حتى">${c.rep_until ? fd(c.rep_until) : '<span class="muted">تبدأ مع أول عقد</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">لا عملاء مسجلون باسمك بعد.</div>'}
        ${d.leads.length ? `<h2 style="margin-top:14px">عملاء محتملون قيد المتابعة (${d.leads.length})</h2><div class="chips">${d.leads.map((l) => `<span class="chip">${esc(l.name)} · ${esc(l.status || '')}</span>`).join('')}</div>` : ''}</section>
      <section><h2>حركات العمولة</h2>${d.rows.length ? `<table class="r"><thead><tr><th>التاريخ</th><th>العميل</th><th>المبلغ المحصّل (الأساس)</th><th>العمولة</th><th>الحالة</th></tr></thead><tbody>
        ${d.rows.map((r) => `<tr><td data-l="التاريخ">${fd(r.earned_at)}</td><td data-l="العميل">${esc(r.client || '')}</td><td data-l="الأساس">${m(r.base_amount)}</td><td data-l="العمولة"><b>${m(r.amount)}</b></td><td data-l="الحالة"><span class="pill p-${esc(r.status)}">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table>`
        : '<div class="empty">تظهر عمولاتك هنا تلقائياً فور تحصيل أي دفعة من عملائك.</div>'}</section>
      ${d.payouts.length ? `<section><h2>الصرفيات</h2><table class="r"><thead><tr><th>رقم الصرف</th><th>التاريخ</th><th>عدد البنود</th><th>المبلغ</th><th>الطريقة</th></tr></thead><tbody>
        ${d.payouts.map((p) => `<tr><td data-l="الرقم" class="num">${esc(p.number)}</td><td data-l="التاريخ">${fd(p.paid_at)}</td><td data-l="البنود" class="num">${p.count}</td><td data-l="المبلغ"><b>${m(p.total)}</b></td><td data-l="الطريقة">${esc(p.method || '')}</td></tr>`).join('')}</tbody></table></section>` : ''}
      <section><h2>كيف تُحتسب عمولتك</h2><ul class="rules">
        <li>تُستحق العمولة عند تحصيل كل دفعة من عميلك، بنسبة <b class="num">${rp.rate}%</b>.</li>
        <li>تشمل العقد الأول وتجديداته لمدة <b class="num">${rp.months}</b> شهراً من بداية أول عقد للعميل.</li>
        <li>تعتمد المالية العمولات المستحقة ثم تُصرف، ويصلك إشعار واتساب عند كل استحقاق وكل صرف.</li>
        <li>هذا الرابط خاص بك — لا تشاركه مع أحد.</li></ul>
        <p style="margin:10px 0 0"><button class="btn" onclick="print()">طباعة / حفظ PDF</button></p></section>
    </div><footer>${esc(d.company)} · جدة</footer>`;
})();
</script>
</body>
</html>
