<style>
  [hidden]{display:none!important}

  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;cursor:pointer;font:inherit;text-align:center;transition:.15s;line-height:1.45}
  .opt:hover{border-color:var(--navy)}
  .opt[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
  .opt small{display:block;font-size:12px;opacity:.8;font-weight:400}
  .mode{text-align:start;display:flex;gap:10px;align-items:center}

  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}

  .inp:focus{outline:none;border-color:var(--navy);background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .f em{display:none;color:var(--bad);font-style:normal;font-size:13px;margin-top:5px}
  .f.bad em{display:block}.f.bad .inp,.f.bad .opts{border-color:var(--bad)}
  .nav{display:flex;gap:10px;margin-top:20px}
  .nav .btn{flex:1;padding:13px}
  .btn.line{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ok{background:var(--teal)}
  .sum{background:#F4F7F8;border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px;line-height:1.9}
  .sum b{color:var(--navy)}
  .done{text-align:center}
  .done .ok-ic{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 12px}
  .meet{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .q{margin-bottom:6px}
  .prog{margin:4px 0 14px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}.box{padding:16px 14px}}
</style>

<script>
'use strict';
(() => {
  const API = '/marketing/hub/api/public/book';
  const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const qs = new URLSearchParams(location.search); const SKEY = qs.get('s'); const LKEY = qs.get('k');
  const t0 = Date.now();
  const SECTORS = [['food', 'المطاعم والمقاهي والحلويات'], ['retail', 'التجزئة والمتاجر الإلكترونية'], ['flowers', 'الورود والهدايا والتغليف'], ['events', 'المناسبات والفعاليات'], ['pro', 'الخدمات المهنية والعقار'], ['npo', 'الجمعيات والقطاع غير الربحي'], ['corp', 'المصانع والشركات والجهات الحكومية'], ['', 'قطاع آخر']];
  const time12 = (t) => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'ص' : 'م'}`; };
  async function call(path = '', body) {
    const r = await fetch(API + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
    const d = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(d.error || 'تعذّر الاتصال — حاول مرة أخرى'); e.fields = d.fields; throw e; } return d;
  }
  function toast(m, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3800); }
  const main = $('#main');

  /* ---------- اختيار الموعد (مشترك بين الحجز وإعادة الجدولة) ---------- */
  function picker(av, st, onChange) {
    const day = av.days.find((d) => d.date === st.date) || null;
    return `<span class="lbl">اختر اليوم <i>*</i></span><div class="days" role="listbox" aria-label="الأيام">${av.days.map((d) => `<button type="button" class="opt" data-day="${d.date}" aria-pressed="${d.date === st.date}">${esc(d.label.split(' ')[0])}<small>${esc(d.label.split(' ').slice(1).join(' '))}</small></button>`).join('')}</div>
      ${day ? `<span class="lbl">اختر الوقت <i>*</i> <small class="muted">(بتوقيت السعودية — ${av.len} دقيقة)</small></span><div class="opts times">${day.slots.map((t) => `<button type="button" class="opt" data-time="${t}" aria-pressed="${t === st.time}">${time12(t)}</button>`).join('')}</div>` : ''}`;
  }
  function bindPicker(root, av, st, redraw) {
    $$('[data-day]', root).forEach((b) => b.onclick = () => { st.date = b.dataset.day; st.time = ''; redraw(); });
    $$('[data-time]', root).forEach((b) => b.onclick = () => { st.time = b.dataset.time; $$('[data-time]', root).forEach((x) => x.setAttribute('aria-pressed', x === b)); });
  }

  /* ---------- الحجز الجديد ---------- */
  async function booking() {
    let av; try { av = await call('/slots'); } catch (e) { main.innerHTML = `<div class="box empty">${esc(e.message)}</div>`; return; }
    let pre = {}; if (LKEY) { try { pre = await call('/prefill?k=' + encodeURIComponent(LKEY)); } catch { /* */ } }
    const st = { step: 1, mode: '', date: av.days[0]?.date || '', time: '', name: pre.name || '', company: pre.company || '', phone: '', email: '', sector: pre.sector || '', city: pre.city || '', notes: '' };
    if (!av.days.length) { main.innerHTML = '<div class="box empty">لا توجد مواعيد متاحة حالياً — راسلنا على واتساب وسنحدد لك موعداً.</div>'; return; }
    const draw = () => {
      main.innerHTML = `<div class="box"><div class="prog"><i style="width:${st.step === 1 ? 50 : 100}%"></i></div>
        ${st.step === 1 ? `<h2 class="t">١. نوع الجلسة وموعدها</h2><p class="sub">اختر ما يناسبك — يمكنك تغييره لاحقاً من رابط الحجز.</p>
          <div class="f" data-f="mode"><span class="lbl">كيف تفضّل الجلسة؟ <i>*</i></span><div class="opts">
            <button type="button" class="opt mode" data-mode="video" aria-pressed="${st.mode === 'video'}"><span class="ic">🎥</span><span><b>اتصال مرئي</b><small>رابط Google Meet يصلك على واتساب</small></span></button>
            <button type="button" class="opt mode" data-mode="phone" aria-pressed="${st.mode === 'phone'}"><span class="ic">📞</span><span><b>مكالمة هاتفية</b><small>نتصل بك في الموعد</small></span></button></div><em>اختر نوع الجلسة</em></div>
          <div class="f" data-f="time">${picker(av, st)}<em>اختر الموعد</em></div>
          <div class="nav"><button class="btn" id="next">التالي</button></div>`
        : `<h2 class="t">٢. بياناتك للتواصل</h2><p class="sub">${esc(dateLabel())} · ${st.mode === 'video' ? 'اتصال مرئي' : 'مكالمة هاتفية'} <button type="button" class="ghost" id="back" style="color:var(--navy);border-color:var(--line);background:#fff">تغيير</button></p>
          <form id="f" novalidate>${pre.ok ? `<div class="sum">أهلاً ${esc(pre.name || '')} 👋 — أكملنا بعض بياناتك مسبقاً، راجعها فقط.</div>` : ''}
            <div class="grid2"><label class="f" data-f="name"><span class="lbl">الاسم <i>*</i></span><input class="inp" name="name" autocomplete="name" value="${esc(st.name)}"><em></em></label>
            <label class="f" data-f="company"><span class="lbl">اسم النشاط أو المنشأة</span><input class="inp" name="company" value="${esc(st.company)}"><em></em></label>
            <label class="f" data-f="phone"><span class="lbl">جوال واتساب <i>*</i></span><input class="inp" name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="05XXXXXXXX" autocomplete="tel" value="${esc(st.phone)}">${pre.phone_hint ? `<small class="muted">الرقم المسجّل لدينا ينتهي بـ ${esc(pre.phone_hint)}</small>` : ''}<em></em></label>
            <label class="f" data-f="email"><span class="lbl">البريد الإلكتروني ${st.mode === 'video' ? '<small class="muted">(لتصلك دعوة التقويم)</small>' : '<small class="muted">(اختياري)</small>'}</span><input class="inp" name="email" type="email" inputmode="email" dir="ltr" autocomplete="email" value="${esc(st.email)}"><em></em></label>
            <label class="f"><span class="lbl">القطاع</span><select class="inp" name="sector">${SECTORS.map(([k, l]) => `<option value="${k}" ${k === st.sector ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
            <label class="f"><span class="lbl">المدينة</span><input class="inp" name="city" value="${esc(st.city)}" placeholder="جدة"></label></div>
            <label class="f"><span class="lbl">ما الذي تريد أن نركّز عليه؟ (اختياري)</span><textarea class="inp" name="notes" rows="2" placeholder="مثال: زيادة الطلبات من المتجر، أو إطلاق حساباتنا">${esc(st.notes)}</textarea></label>
            <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="nav"><button type="button" class="btn line" id="back2">السابق</button><button class="btn ok" id="go">تأكيد الحجز</button></div></form>`}
      </div>`;
      if (st.step === 1) {
        $$('[data-mode]').forEach((b) => b.onclick = () => { st.mode = b.dataset.mode; $$('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('[data-f=mode]').classList.remove('bad'); });
        bindPicker(main, av, st, draw);
        $('#next').onclick = () => {
          let ok = true; if (!st.mode) { $('[data-f=mode]').classList.add('bad'); ok = false; }
          if (!st.time) { $('[data-f=time]').classList.add('bad'); ok = false; }
          if (ok) { st.step = 2; draw(); scrollTo({ top: 0, behavior: 'smooth' }); }
        };
      } else {
        const keep = () => { const f = $('#f'); ['name', 'company', 'phone', 'email', 'sector', 'city', 'notes'].forEach((k) => st[k] = f.elements[k].value.trim()); };
        $('#back').onclick = $('#back2').onclick = () => { keep(); st.step = 1; draw(); };
        $('#f').onsubmit = async (e) => {
          e.preventDefault(); keep(); $$('.f.bad').forEach((x) => x.classList.remove('bad'));
          const b = $('#go'); b.disabled = true; b.textContent = 'جارٍ الحجز…';
          try {
            const r = await call('', { ...st, k: LKEY || undefined, website: $('#f').elements.website.value, elapsed: Date.now() - t0, source: LKEY ? 'دعوة من الفريق' : (qs.get('src') || 'الحجز الذاتي') });
            try { window.NBA && window.NBA.lead('booking', { session_mode: st.mode || '' }); } catch (e) {}
            done(r);
          } catch (err) {
            if (err.fields) { if (err.fields.time) { st.step = 1; st.time = ''; av = await call('/slots').catch(() => av); draw(); }
              Object.entries(err.fields).forEach(([k, m]) => { const f = $(`[data-f=${k}]`); if (f) { f.classList.add('bad'); const em = $('em', f); if (em) em.textContent = m; } }); }
            toast(err.message, 1); b.disabled = false; b.textContent = 'تأكيد الحجز';
          }
        };
      }
    };
    const dateLabel = () => { const d = av.days.find((x) => x.date === st.date); return `${d ? d.label : st.date} — ${time12(st.time)}`; };
    draw();
  }
  function done(r) {
    $('#h1').textContent = 'تم حجز جلستك ✓'; $('#hp').textContent = 'وصلك التأكيد على واتساب، ومعه رابط لإدارة الحجز.';
    main.innerHTML = `<div class="box done"><div class="ok-ic">✓</div><h2 class="t">موعدك: ${esc(r.session.when)}</h2>
      <div class="sum">${r.session.mode === 'video' ? `🎥 اتصال مرئي (${r.session.len} دقيقة)${r.session.meet ? `<br><a href="${esc(r.session.meet)}" target="_blank" rel="noopener">رابط الاجتماع</a>` : '<br>سيصلك رابط الاجتماع على واتساب.'}` : `📞 مكالمة هاتفية (${r.session.len} دقيقة) — سنتصل بك في الموعد.`}<br>رقم الحجز: <b class="num">${esc(r.session.number)}</b></div>
      <h2 class="t" style="margin-top:18px">خطوة أخيرة تجعل الجلسة أنفع لك</h2><p class="sub">أجب عن أسئلة قصيرة عن نشاطك (3 دقائق) ليصل مسؤول الحسابات إلى الجلسة مستعداً بأسئلة وحلول تخصك.</p>
      <a class="btn ok" href="?s=${encodeURIComponent(r.key)}" style="width:100%;padding:13px">ابدأ الاستبيان</a></div>`;
    scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- إدارة الحجز + الاستبيان ---------- */
  async function manage() {
    let S; try { S = await call('/s/' + encodeURIComponent(SKEY)); } catch (e) { main.innerHTML = `<div class="box empty">${esc(e.message)}</div>`; return; }
    $('#h1').textContent = S.status === 'ملغاة' ? 'الجلسة ملغاة' : 'جلسة التشخيص'; $('#hp').textContent = `${S.company || S.name || ''} · رقم الحجز ${S.number}`; $('#pts').hidden = true;
    const ans = { ...(S.answers || {}) };
    const qhtml = (q) => {
      const v = ans[q.id];
      if (q.type === 'one' || q.type === 'many') return `<div class="f q" data-f="${q.id}"><span class="lbl">${esc(q.label)} ${q.req ? '<i>*</i>' : ''}${q.type === 'many' ? ' <small class="muted">اختر كل ما ينطبق</small>' : ''}</span>
        <div class="opts">${q.o.map((o) => `<button type="button" class="opt" data-q="${q.id}" data-v="${esc(o)}" aria-pressed="${q.type === 'many' ? (v || []).includes(o) : v === o}">${esc(o)}</button>`).join('')}</div><em>مطلوب</em></div>`;
      return `<label class="f q" data-f="${q.id}"><span class="lbl">${esc(q.label)} ${q.req ? '<i>*</i>' : ''}</span>${q.type === 'area' ? `<textarea class="inp" rows="2" data-t="${q.id}" placeholder="${esc(q.ph || '')}">${esc(v || '')}</textarea>` : `<input class="inp" data-t="${q.id}" value="${esc(v || '')}" placeholder="${esc(q.ph || '')}">`}<em>مطلوب</em></label>`;
    };
    const draw = () => {
      const active = ['محجوزة', 'مؤكدة'].includes(S.status);
      main.innerHTML = `<div class="box"><h2 class="t">${esc(S.when)}</h2>
        <div class="sum">${S.mode === 'video' ? '🎥 اتصال مرئي' : '📞 مكالمة هاتفية'} · ${S.len} دقيقة مع مسؤول الحسابات · الحالة: <b>${esc(S.status)}</b></div>
        ${active ? `<div class="meet">${S.mode === 'video' ? (S.meet ? `<a class="btn ok" href="${esc(S.meet)}" target="_blank" rel="noopener">🎥 انضم للاجتماع</a>` : '<span class="small muted">سيصلك رابط الاجتماع على واتساب قبل الموعد.</span>') : ''}
          ${S.can_change ? '<button class="btn line" id="resch">تغيير الموعد</button><button class="btn line" id="cancel">إلغاء الحجز</button>' : ''}</div>` : `<div class="meet"><a class="btn" href="/book">احجز موعداً جديداً</a></div>`}</div>
        ${active ? `<div class="box"><h2 class="t">${S.survey_done ? '✅ استبيان نشاطك مكتمل' : '📝 استبيان نشاطك (3 دقائق)'}</h2><p class="sub">${S.survey_done ? 'شكراً لك — يمكنك تعديل إجاباتك حتى موعد الجلسة.' : 'إجاباتك تساعد مسؤول الحسابات على تجهيز جلسة مخصصة لنشاطك.'}</p>
          <form id="sv" novalidate>${S.questions.map(qhtml).join('')}<div class="nav"><button class="btn ok" id="svgo">${S.survey_done ? 'حفظ التعديلات' : 'إرسال الإجابات'}</button></div></form></div>` : ''}`;
      $$('[data-q]').forEach((b) => b.onclick = () => {
        const q = S.questions.find((x) => x.id === b.dataset.q); const v = b.dataset.v;
        if (q.type === 'many') { const a = new Set(ans[q.id] || []); a.has(v) ? a.delete(v) : a.add(v); ans[q.id] = [...a]; b.setAttribute('aria-pressed', a.has(v)); }
        else { ans[q.id] = v; $$(`[data-q="${q.id}"]`).forEach((x) => x.setAttribute('aria-pressed', x === b)); }
        $(`[data-f="${q.id}"]`)?.classList.remove('bad');
      });
      const sv = $('#sv');
      if (sv) sv.onsubmit = async (e) => {
        e.preventDefault(); $$('[data-t]').forEach((i) => ans[i.dataset.t] = i.value.trim()); $$('.f.bad').forEach((x) => x.classList.remove('bad'));
        const b = $('#svgo'); b.disabled = true;
        try { await call('/s/' + encodeURIComponent(SKEY) + '/survey', { answers: ans }); S.survey_done = true; toast('شكراً لك — وصلتنا إجاباتك'); draw(); scrollTo({ top: 0, behavior: 'smooth' }); }
        catch (err) { if (err.fields) { Object.keys(err.fields).forEach((k) => $(`[data-f="${k}"]`)?.classList.add('bad')); $('.f.bad')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); } toast(err.message, 1); b.disabled = false; }
      };
      const c = $('#cancel'); if (c) c.onclick = async () => {
        const reason = prompt('سبب الإلغاء (اختياري):'); if (reason === null) return;
        try { await call('/s/' + encodeURIComponent(SKEY) + '/cancel', { reason }); S.status = 'ملغاة'; toast('أُلغي الحجز'); draw(); } catch (err) { toast(err.message, 1); }
      };
      const rs = $('#resch'); if (rs) rs.onclick = () => resched();
    };
    async function resched() {
      const av = await call('/slots'); const st = { date: av.days[0]?.date || '', time: '' };
      const box = document.createElement('div'); box.className = 'box';
      const paint = () => { box.innerHTML = `<h2 class="t">اختر الموعد الجديد</h2>${picker(av, st)}<div class="nav"><button class="btn line" id="rx">تراجع</button><button class="btn ok" id="rgo">تأكيد الموعد الجديد</button></div>`;
        bindPicker(box, av, st, paint); $('#rx', box).onclick = () => box.remove();
        $('#rgo', box).onclick = async () => { if (!st.time) return toast('اختر الوقت', 1); try { const r = await call('/s/' + encodeURIComponent(SKEY) + '/reschedule', st); toast('تم تغيير الموعد'); S = await call('/s/' + encodeURIComponent(SKEY)); draw(); } catch (err) { toast(err.message, 1); } }; };
      paint(); main.prepend(box); box.scrollIntoView({ behavior: 'smooth' });
    }
    draw();
  }
  (SKEY ? manage : booking)();
})();
</script>
</body>
</html>
